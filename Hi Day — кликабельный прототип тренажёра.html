<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hi Day — тренажёр собеседований (прототип)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--mint:#70BFA1;--mint-l:#B9DFD0;--coral:#FF5230;--coral-l:#FFD9D0;--beige:#EBE7DF;--ink:#1a1a1a;--mute:#6f6b64;--w:#fff;
--r-l:28px;--r-m:20px;--r-p:999px;--s1:8px;--s2:16px;--s3:24px;--hf:'Montserrat','Arial Black',sans-serif;--bf:'Inter',Arial,sans-serif;
padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#d8d3c9;font-family:var(--bf);color:var(--ink);display:flex;justify-content:center;align-items:center}
#phone{width:100%;max-width:390px;height:100%;max-height:820px;background:var(--beige);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#phone{border-radius:40px;box-shadow:0 20px 60px #0003}}
#app{flex:1;overflow-y:auto;padding:var(--s3) var(--s2) var(--s2);position:relative}
h1{font:800 30px/1.15 var(--hf);letter-spacing:-.5px}h2{font:800 22px/1.2 var(--hf)}h3{font:700 16px/1.3 var(--hf)}
.cap{font:500 13px var(--bf);color:var(--mute)}.mint{color:var(--mint)}.coral{color:var(--coral)}
.card{background:var(--w);border-radius:var(--r-l);padding:var(--s2) 20px;margin-bottom:12px}
.card.m{background:var(--mint);color:#fff}.card.c{background:var(--coral);color:#fff}.card.b{background:var(--beige);border:2px solid var(--mint-l)}
button{font:700 16px var(--hf);border:0;border-radius:var(--r-p);padding:16px 24px;cursor:pointer;width:100%;background:var(--ink);color:#fff;margin-top:8px}
button.c{background:var(--coral)}button.m{background:var(--mint)}button.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:disabled{background:#cfcac0;color:#fff;cursor:default}button:focus-visible,.opt:focus-visible,.nv:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.pill{display:inline-block;padding:10px 18px;border-radius:var(--r-p);background:var(--w);font:500 14px var(--bf);margin:0 6px 8px 0;border:2px solid transparent;cursor:pointer}
.pill.on{background:var(--mint-l);border-color:var(--mint);color:#17604a}.pill.off{opacity:.5;cursor:default}
.badge{font:700 10px var(--bf);background:var(--coral);color:#fff;border-radius:var(--r-p);padding:2px 7px;margin-left:6px}
input{width:100%;padding:16px 18px;border-radius:var(--r-p);border:2px solid var(--mint-l);font:500 15px var(--bf);background:#fff;margin-bottom:10px}
input:focus{outline:none;border-color:var(--mint)}
.bar{height:12px;border-radius:var(--r-p);background:var(--beige);overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:var(--r-p);transition:width .3s}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.opt{background:#fff;border:2px solid var(--beige);border-radius:var(--r-m);padding:16px;margin-bottom:10px;font:500 16px var(--bf);cursor:pointer;display:block;width:100%;text-align:left}
.opt.sel{border-color:var(--mint);background:#EAF6F1}.opt.ok{border-color:var(--mint);background:var(--mint-l)}.opt.bad{border-color:var(--coral);background:var(--coral-l)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:20px var(--s2) 24px;border-radius:var(--r-l) var(--r-l) 0 0;z-index:5}
.sheet.ok{background:var(--mint-l)}.sheet.bad{background:var(--coral-l)}
nav{display:flex;background:#fff;border-radius:var(--r-l) var(--r-l) 0 0;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.nv{flex:1;text-align:center;font:500 10px var(--bf);cursor:pointer;position:relative;padding:4px 0;background:none;border:0;color:var(--ink);margin:0;width:auto;border-radius:12px}
.nv b{display:block;font-size:20px;margin-bottom:2px}.nv.on{color:var(--mint)}.nv.soon{color:#b5b0a6;cursor:default}
.nv .badge{position:absolute;top:-6px;right:0;margin:0;font-size:8px;padding:2px 5px}
.bub{background:#fff;border-radius:20px 20px 20px 6px;padding:14px 16px;margin-bottom:10px;max-width:92%;font-size:14px;line-height:1.5}
.bub.u{background:var(--mint);color:#fff;border-radius:20px 20px 6px 20px;margin-left:auto}
.drop{border:3px dashed var(--mint);border-radius:var(--r-l);padding:36px 16px;text-align:center;background:#fff;cursor:pointer}
.wave{position:absolute;right:-30px;top:0;opacity:.5;pointer-events:none}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--mint-l);border-top-color:var(--coral);animation:sp 1s linear infinite;margin:0 auto 20px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;font-size:13px}.dot.d{background:#fff;color:var(--coral)}
.big{font:800 64px var(--hf)}
.back{background:none;color:var(--ink);width:auto;padding:0;margin:0 0 12px;font:500 14px var(--bf)}
</style></head><body><div id="phone"><div id="app"></div><div id="nv"></div></div>
<script>
const Q=(q,o,c)=>[q,o.split('|'),c];
const T={Python:[Q('Что вернёт type(3/2)?','int|float|str',1),Q('Чему равно len([1,2,3])?','2|3|4',1),Q("Что вернёт 'abc'[1]?","'a'|'b'|'c'",1),Q('Как объявить функцию?','def f():|function f()|fn f()',0),Q('Чему равно 2**3?','6|8|9',1),Q('Какой тип изменяемый?','tuple|list|str',1),Q('Чему равно 7//2?','3|3.5|4',0),Q('Как получить ключи словаря d?','d.keys()|d.key()|keys(d)',0),Q('Что делает break?','Прерывает цикл|Пропускает итерацию|Завершает программу',0),Q('Индекс первого элемента списка?','0|1|-1',0)],
Java:[Q('Примитивный тип для целых?','int|String|double',0),Q('Точка входа в программу?','main|start|run',0),Q('Ключевое слово наследования?','extends|inherits|implements',0),Q('Размер массива a?','a.length|a.length()|a.size()',0),Q('Как сравнить строки по значению?','equals|==|compare',0),Q('Модификатор, закрывающий доступ извне?','private|public|static',0),Q('Как создать объект?','new|create|make',0),Q('Какой тип не примитивный?','boolean|String|char',1),Q('Значение int по умолчанию?','0|null|-1',0),Q('Как класс реализует интерфейс?','implements|extends|uses',0)],
'C++':[Q('Вывод в консоль?','cout|print|echo',0),Q('Как объявить указатель?','int* p|int p&|ptr p',0),Q('Адрес переменной x?','&x|*x|@x',0),Q('Динамический массив в STL?','vector|array[]|map',0),Q('Что освобождает память после new?','delete|free|remove',0),Q('Как подключить заголовок?','#include|import|using',0),Q('Чему равно sizeof(char)?','1|2|4',0),Q('Как объявить ссылку?','int& r = x|int^ r = x|int@ r = x',0),Q('Чем заканчивается оператор?',';|.|:',0),Q('Доступ к полю через указатель?','->|.|::',0)]};
const S={mode:'reg',dir:'Development',grade:'Junior',lang:null,qi:0,score:0,lives:5,combo:0,sel:null,chk:false,wrong:[],cv:'idle',streak:3,done:12,name:'Алина'};
const $=id=>document.getElementById(id);
const wave='<svg class="wave" width="200" height="160" viewBox="0 0 200 160" fill="none" stroke="#999" stroke-width=".8">'+[0,1,2,3,4,5,6,7].map(i=>`<path d="M0 ${20+i*14} Q50 ${i*14} 100 ${30+i*14} T200 ${20+i*14}"/>`).join('')+'</svg>';
const star='<svg width="64" height="64" viewBox="0 0 64 64" fill="#FF5230"><path d="M32 0l8 22 24-6-16 18 16 18-24-6-8 22-8-22-24 6 16-18L0 16l24 6z"/></svg>';
const NAV=[['Интервью','🎙',1,'int'],['Тесты','✓',0,'home'],['Резюме','📄',0,'cv'],['HR-вопросы','💬',1,'hr'],['Профиль','👤',0,'profile']];
const noNav=['auth','setup','quiz','result'];
function nav(s){const on={home:'home',langs:'home',review:'home',cv:'cv',profile:'profile'}[s];
$('nv').innerHTML=noNav.includes(s)?'':'<nav aria-label="Основная навигация">'+NAV.map(n=>n[2]?`<button class="nv soon" aria-disabled="true" title="Скоро"><span class="badge">Скоро</span><b>${n[1]}</b>${n[0]}</button>`:`<button class="nv ${on==n[3]?'on':''}" onclick="go('${n[3]}')"><b>${n[1]}</b>${n[0]}</button>`).join('')+'</nav>'}
function go(s){const a=$('app');a.scrollTop=0;a.innerHTML=V[s]();nav(s);if(s=='cv'&&S.cv=='proc')setTimeout(()=>{if(S.cv=='proc'){S.cv='chat';go('cv')}},2200)}
const V={
auth(){const r=S.mode=='reg';return`${wave}<div style="margin-top:40px">${star}</div><h1 style="margin:16px 0 8px">${r?'Готовься к собеседованиям спокойно':'С возвращением!'}</h1><p class="cap" style="margin-bottom:24px">Короткие тесты каждый день — и уверенность растёт шаг за шагом.</p>
<div class="row" style="margin-bottom:16px"><span class="pill ${r?'on':''}" onclick="S.mode='reg';go('auth')">Регистрация</span><span class="pill ${r?'':'on'}" onclick="S.mode='in';go('auth')">Вход</span></div>
${r?'<input placeholder="Имя" aria-label="Имя">':''}<input placeholder="Email" type="email" aria-label="Email"><input placeholder="Пароль (от 8 символов)" type="password" aria-label="Пароль">
<button class="c" onclick="go('${r?'setup':'home'}')">${r?'Создать аккаунт':'Войти'}</button><p class="cap" style="text-align:center;margin-top:16px">Без карты. Базовые тесты бесплатны.</p>`},
setup(){const p=(k,v,off)=>`<span class="pill ${S[k]==v?'on':''} ${off?'off':''}" ${off?'':`onclick="S.${k}='${v}';go('setup')"`}>${v}${off?'<span class="badge">Скоро</span>':''}</span>`;
return`<p class="cap">Шаг 2 из 2</p><div class="bar" style="margin:8px 0 24px"><i style="width:100%"></i></div><h1>Куда стремишься?</h1><p class="cap" style="margin:8px 0 20px">Мы подберём тесты под твой уровень. Изменить можно в профиле.</p>
<h3 style="margin-bottom:12px">Направление</h3>${p('dir','Development')}${p('dir','QA',1)}${p('dir','BA/SA',1)}
<h3 style="margin:16px 0 12px">Грейд</h3>${['Junior','Middle','Senior','Practice'].map(g=>p('grade',g)).join('')}
<div class="card b" style="margin-top:8px"><p class="cap">Сейчас приложение лучше всего настроено на Junior — с него и начнём 🌱</p></div><button class="c" onclick="go('home')">Начать</button>`},
home(){const f=S.done%10*10;return`${wave}<p class="cap">Привет, ${S.name}</p><h1 style="margin:4px 0 20px">Сегодня — маленький шаг к офферу</h1>
<div class="card c"><div class="row sp"><div><h2>🔥 ${S.streak} дня подряд</h2><p style="font-size:13px;margin-top:4px">Пройди один тест — серия продолжится</p></div></div><div class="row" style="margin-top:14px;gap:6px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<span class="dot ${i<S.streak?'d':''}">${i<S.streak?'✓':d[0]}</span>`).join('')}</div></div>
<div class="card"><div class="row sp"><h3>Цель на день</h3><span class="cap">${S.done%10}/10 вопросов</span></div><div class="bar" style="margin-top:12px"><i style="width:${f}%"></i></div></div>
<div class="card m"><h2>Тест дня · ${S.dir}</h2><p style="font-size:14px;margin:6px 0 4px">10 вопросов · около 3 минут · ${S.grade}</p><button class="c" onclick="go('langs')">Выбрать язык</button></div>
<div class="row"><div class="card" style="flex:1"><h2 class="mint">${S.done}</h2><p class="cap">тестов пройдено</p></div><div class="card" style="flex:1"><h2 class="coral">82%</h2><p class="cap">средний балл</p></div></div>`},
langs(){const L=[['Python','🐍','Лучший: 9/10'],['Java','☕','Новый'],['C++','⚙️','Новый']];return`<button class="back" onclick="go('home')">← Назад</button><h1>Выбери язык</h1><p class="cap" style="margin:8px 0 20px">10 вопросов, 5 жизней. Ошибка — не страшно, разберём вместе.</p>${L.map(l=>`<div class="card row sp" style="cursor:pointer" tabindex="0" onclick="start('${l[0]}')"><div class="row"><span style="font-size:32px">${l[1]}</span><div><h3>${l[0]}</h3><p class="cap">${l[2]} · ${S.grade}</p></div></div><span class="mint" style="font-size:24px">›</span></div>`).join('')}`},
quiz(){const t=T[S.lang],q=t[S.qi],last=S.qi==t.length-1;const ok=S.sel===q[2];
return`<div class="row" style="margin-bottom:24px"><button class="back" style="margin:0;font-size:22px" aria-label="Выйти" onclick="if(confirm('Выйти? Прогресс этого теста не сохранится.'))go('langs')">✕</button><div class="bar" style="flex:1"><i style="width:${(S.qi+(S.chk?1:0))*10}%"></i></div><b class="coral">♥ ${S.lives}</b></div>
<p class="cap">Вопрос ${S.qi+1} из 10 ${S.combo>1?`· 🔥 ${S.combo} подряд`:''}</p><h1 style="margin:8px 0 24px;font-size:26px">${q[0]}</h1>
${q[1].map((o,i)=>`<button class="opt ${S.chk?(i==q[2]?'ok':i==S.sel?'bad':''):S.sel===i?'sel':''}" ${S.chk?'disabled':''} onclick="S.sel=${i};go('quiz')">${o}</button>`).join('')}
${S.chk?`<div class="sheet ${ok?'ok':'bad'}"><h2 style="color:${ok?'#17604a':'#c23a1c'}">${ok?'Верно! 🎉':'Почти!'}</h2><p style="margin:6px 0 4px;font-size:14px">${ok?'Так держать.':'Правильный ответ: <b>'+q[1][q[2]]+'</b>. Запомним и вернёмся.'}</p><button class="${ok?'m':'c'}" onclick="nextQ()">${last||S.lives==0?'Завершить':'Дальше'}</button></div>`:`<button ${S.sel===null?'disabled':''} onclick="check()" style="margin-top:20px">Проверить</button>`}`},
result(){const n=S.score,m=n>=8?['Отлично! Ты готов к реальным вопросам 💪','m']:n>=5?['Хороший результат. Разберём ошибки — и будет ещё лучше.','m']:['Это только начало. Каждый тест делает тебя увереннее 🌱','c'];
return`${wave}<div style="text-align:center;margin-top:30px"><p class="cap">${S.lang} · Junior</p><div class="big ${m[1]=='m'?'mint':'coral'}">${n}/10</div><h2 style="margin:12px 0">${m[0]}</h2><p class="cap">Серия: 🔥 ${S.streak} дн. · Жизней осталось: ♥ ${S.lives}</p></div>
<div style="margin-top:32px"><button class="m" onclick="start('${S.lang}')">Пройти тест ещё раз</button><button class="o" onclick="go('review')">Разобрать ошибки (${S.wrong.length})</button><button class="back" style="width:100%;text-align:center;margin-top:16px" onclick="go('home')">На главную</button></div>`},
review(){return`<button class="back" onclick="go('result')">← К результату</button><h1>Разбор ошибок</h1><p class="cap" style="margin:8px 0 20px">Ошибаться нормально — так запоминается лучше.</p>${S.wrong.length?S.wrong.map(w=>`<div class="card"><h3 style="margin-bottom:12px">${w[0]}</h3><div class="opt bad" style="cursor:default">✕ Твой ответ: ${w[1]}</div><div class="opt ok" style="cursor:default;margin:0">✓ Верно: ${w[2]}</div></div>`).join(''):'<div class="card b" style="text-align:center;padding:40px 16px"><h2>Ошибок нет 🎉</h2><p class="cap" style="margin-top:8px">Идеальный результат! Попробуй другой язык.</p><button class="c" onclick="go(\'langs\')">Выбрать язык</button></div>'}<button class="o" onclick="start('${S.lang}')">Пройти тест ещё раз</button>`},
cv(){const c=S.cv;let b='';
if(c=='idle')b=`<div class="drop" tabindex="0" onclick="S.cv='proc';go('cv')"><div style="font-size:40px">📄</div><h3 style="margin:8px 0">Перетащи резюме сюда</h3><p class="cap">или нажми, чтобы выбрать файл · PDF или DOCX до 5 МБ</p></div><div class="card b" style="margin-top:16px"><p class="cap">Мы проверим, пройдёт ли резюме ATS-фильтры, и подскажем, что улучшить.</p></div><button class="back" style="text-align:center;margin-top:12px;width:100%" onclick="S.cv='err';go('cv')">Показать состояние ошибки</button>`;
if(c=='proc')b=`<div class="card" style="text-align:center;padding:48px 16px"><div class="spin"></div><h2>Читаем резюме…</h2><p class="cap" style="margin-top:8px">Обычно это занимает до 20 секунд</p><div class="bar" style="margin-top:20px"><i style="width:70%"></i></div></div>`;
if(c=='err')b=`<div class="card" style="text-align:center;padding:36px 16px;border:2px solid var(--coral)"><div style="font-size:40px">⚠️</div><h2 style="margin:8px 0">Не удалось прочитать файл</h2><p class="cap">Файл повреждён или защищён паролем. Сохрани его как PDF с текстом и загрузи снова.</p><button class="c" onclick="S.cv='idle';go('cv')">Загрузить другой файл</button></div>`;
if(c=='chat')b=`<div class="bub u">📎 CV_Junior_Developer.pdf</div><div class="bub">Готово! ATS-оценка: <b class="mint">72 из 100</b>. База хорошая — есть что подтянуть 👇</div><div class="bub"><b>Что получилось:</b><br>✓ Чёткая структура<br>✓ Указан стек технологий</div><div class="bub"><b>Что улучшить для ATS:</b><br>1. Добавь ключевые слова из вакансии: Python, SQL, Git<br>2. Замени «участвовал в» на глаголы с результатом<br>3. Убери таблицы и иконки — парсеры их теряют<br>4. Добавь ссылку на GitHub</div><div class="row" style="flex-wrap:wrap;gap:0"><span class="pill on">Переписать опыт</span><span class="pill on">Подобрать ключевые слова</span></div><input placeholder="Спроси про резюме…" aria-label="Сообщение" style="margin-top:8px"><button class="o" onclick="S.cv='idle';go('cv')">Загрузить новую версию</button>`;
return`<h1 style="margin-bottom:6px">Анализ резюме</h1><p class="cap" style="margin-bottom:20px">ИИ-помощник и ATS-фильтры</p>${b}`},
profile(){const st=[['12','тестов'],['82%','ср. балл'],['3','дня серия']];return`${wave}<div class="row" style="margin:12px 0 20px"><div style="width:72px;height:72px;border-radius:50%;background:var(--mint);color:#fff;display:flex;align-items:center;justify-content:center;font:800 28px var(--hf)">${S.name[0]}</div><div><h2>${S.name}</h2><p class="cap">alina@mail.ru</p></div></div>
<div class="card"><h3 style="margin-bottom:12px">Мой путь</h3><span class="pill on">${S.dir}</span><span class="pill on">${S.grade}</span><button class="o" style="padding:10px" onclick="go('setup')">Изменить</button></div>
<div class="row" style="gap:8px">${st.map(s=>`<div class="card" style="flex:1;text-align:center;padding:16px 6px"><h2 class="coral">${s[0]}</h2><p class="cap">${s[1]}</p></div>`).join('')}</div>
<div class="card"><h3 style="margin-bottom:12px">Прогресс по языкам</h3>${[['Python',90],['Java',40],['C++',20]].map(l=>`<div class="row sp cap" style="margin-top:8px"><span>${l[0]}</span><span>${l[1]}%</span></div><div class="bar"><i style="width:${l[1]}%"></i></div>`).join('')}</div>
<button class="o" onclick="go('auth')">Выйти</button>`}};
function start(l){Object.assign(S,{lang:l,qi:0,score:0,lives:5,combo:0,sel:null,chk:false,wrong:[]});go('quiz')}
function check(){const q=T[S.lang][S.qi];S.chk=true;if(S.sel===q[2]){S.score++;S.combo++}else{S.lives--;S.combo=0;S.wrong.push([q[0],q[1][S.sel],q[1][q[2]]])}go('quiz')}
function nextQ(){if(S.qi==9||S.lives==0){S.done++;S.streak=Math.max(S.streak,4);return go('result')}S.qi++;S.sel=null;S.chk=false;go('quiz')}
go('auth');
</script></body></html>
